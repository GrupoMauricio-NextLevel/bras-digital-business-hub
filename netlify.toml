# Netlify: o runtime Next.js é detectado automaticamente (@netlify/plugin-nextjs).
# O banco deve ser externo (Turso), pois não há disco persistente nas funções.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_DEMO_MODE = "true"

# Defina no painel da Netlify (Site configuration → Environment variables):
#   DATABASE_URL        = libsql://SEU-BANCO.turso.io
#   DATABASE_AUTH_TOKEN = <token do Turso>
